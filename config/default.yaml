server:
  port: 3000
  host: '0.0.0.0'
  logLevel: 'info'
  # Enable only when the service is behind a trusted reverse proxy.
  trustProxy: false

security:
  apiKey: 'change-me'
  # Legacy behaviour: allow account path tokens to trigger a global sync.
  # Keep disabled for proper per-account isolation.
  allowLegacyGlobalAccountTokens: false

ondemand:
  enabled: true

scheduler:
  enabled: true
  interval: 600

ui:
  enabled: true
  # Maximum number of events kept in memory (circular buffer).
  historySize: 500
  # Polling interval used by the web UI, in seconds.
  refreshSeconds: 10

ipProviders:
  - https://api.ipify.org
  - https://ifconfig.me/ip
  - https://icanhazip.com

accounts: []
