server:
  port: 3000
  host: '0.0.0.0'
  logLevel: 'info'

security:
  apiKey: 'change-me'
  # Legacy behaviour: allow account path tokens to trigger a global sync.
  # Keep disabled for proper per-account isolation.
  allowLegacyGlobalAccountTokens: false

ondemand:
  enabled: true

scheduler:
  enabled: true
  interval: 600

ipProviders:
  - https://api.ipify.org
  - https://ifconfig.me/ip
  - https://icanhazip.com

accounts: []
