image: docker:27.5.1

variables:
  IMAGE_TAG: $CI_REGISTRY_IMAGE:node-24
  PNPM_STORE_DIR: .pnpm-store

stages:
  - test
  - build
  - push

test:
  stage: test
  image: node:24.22.1-alpine
  before_script:
    - corepack enable
    - pnpm config set store-dir "$PNPM_STORE_DIR"
  cache:
    key:
      files:
        - pnpm-lock.yaml
    paths:
      - .pnpm-store
  script:
    - pnpm install --frozen-lockfile
    - pnpm typecheck
    - pnpm test:coverage
    - pnpm audit --audit-level=high
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - coverage/

build_image:
  stage: build
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin $CI_REGISTRY
  script:
    - |
      if [ "$CI_COMMIT_REF_NAME" = "main" ]; then
        export IMAGE_TAG="$CI_REGISTRY_IMAGE:release"
      elif [ "$CI_COMMIT_REF_NAME" = "develop" ]; then
        export IMAGE_TAG="$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"
      else
        export IMAGE_TAG="$CI_REGISTRY_IMAGE:$CI_COMMIT_REF_NAME"
      fi
      docker build -t $IMAGE_TAG .
    - echo $IMAGE_TAG > image_tag.txt
  artifacts:
    paths:
      - image_tag.txt

push_image:
  stage: push
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin $CI_REGISTRY
  script:
    - export IMAGE_TAG=$(cat image_tag.txt)
    - docker push $IMAGE_TAG
    - |
      if [ "$CI_COMMIT_REF_NAME" = "main" ]; then
        docker tag $IMAGE_TAG $CI_REGISTRY_IMAGE:latest
        docker push $CI_REGISTRY_IMAGE:latest
      fi
  only:
    - main
    - develop
